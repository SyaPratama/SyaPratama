name: Metrics

on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: [".github/workflows/metrics.yml"]}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GITHUB_TOKEN keeps setup at zero secrets; private-repo plugins need a PAT instead.
          token: ${{ secrets.GITHUB_TOKEN }}
          template: terminal
          filename: github-metrics.svg
          config_timezone: Asia/Jakarta
          config_animations: no
          base: header, metadata
          repositories_forks: no
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-contributions.svg
          config_timezone: Asia/Jakarta
          config_animations: no
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
