name: Metrics

on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: [".github/workflows/metrics.yml"]}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-contributions.svg
          config_timezone: Asia/Jakarta
          config_animations: no
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
      - name: Pull request and issue follow-up
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-activity.svg
          config_timezone: Asia/Jakarta
          config_animations: no
          base: ""
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_archived: no
      - name: PasokanMataram insights
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: project-insights.svg
          config_animations: no
          template: repository
          user: SyaPratama
          repo: PasokanMataram
          base: header, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_lines: yes
          plugin_lines_sections: base
      - name: PasokanMataram contributors
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: project-contributors.svg
          config_animations: no
          template: repository
          user: SyaPratama
          repo: PasokanMataram
          base: ""
          plugin_contributors: yes
          plugin_contributors_head: main
          plugin_contributors_contributions: yes
      - name: Portfolio PageSpeed
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: pagespeed.svg
          config_animations: no
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://syapratama.vercel.app
          plugin_pagespeed_detailed: yes
