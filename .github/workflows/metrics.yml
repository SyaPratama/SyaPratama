name: Metrics

on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: [".github/workflows/metrics.yml"]}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Terminal stats
        uses: yogeshwaran01/github-stats-terminal-style@v1.0.0
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          theme: tokyonight
          headerStyle: retro
          commands: whoami,languages,top-repos,uptime,exit
          outputPath: github_stats.svg
      - name: Commit terminal stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github_stats.svg
          git diff --cached --quiet || (git commit -m "chore: update terminal stats [skip ci]" && git push)
      - name: Commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-contributions.svg
          config_timezone: Asia/Jakarta
          config_animations: no
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
      - name: Development activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-activity.svg
          config_timezone: Asia/Jakarta
          config_animations: no
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_archived: no
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_filter: push, issue, pr, review, release
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_self: yes
          plugin_notable_repositories: yes
      - name: PasokanMataram insights
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: project-insights.svg
          config_animations: no
          template: repository
          user: SyaPratama
          repo: PasokanMataram
          base: header, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_lines: yes
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 1
          plugin_lines_history_limit: 1
          plugin_contributors: yes
          plugin_contributors_head: main
          plugin_contributors_contributions: yes
          plugin_licenses: yes
      - name: Portfolio PageSpeed
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: pagespeed.svg
          config_animations: no
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://syapratama.vercel.app
          plugin_pagespeed_detailed: yes
